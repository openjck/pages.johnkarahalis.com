[build]

  command = 'npm run build'
  publish = 'dist'

[[headers]]

  for = '/*'

  [headers.values]
    # Umami does not document the domains that must be allowed in connect-src.
    # This list is based on something a user shared on GitHub:
    #
    # https://github.com/umami-software/umami/discussions/2719#discussioncomment-9459641
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; connect-src 'self' gateway.umami.is eu.umami.is api-gateway-eu.umami.dev api-gateway.umami.dev; form-action 'none'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'unsafe-inline' 'self' cloud.umami.is; style-src 'unsafe-inline' 'self';"

    Strict-Transport-Security = 'max-age=63072000; preload'
    X-Content-Type-Options = 'nosniff'
    X-Frame-Options = 'DENY'
    X-XSS-Protection = '1; mode=block'

[[redirects]]

  from = 'https://flourishing-figolla-6dfdc8.netlify.app/*'
  to = 'https://pages.johnkarahalis.com/:splat'
  status = 301
  force = true
